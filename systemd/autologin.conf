# Installed to /etc/systemd/system/getty@tty1.service.d/autologin.conf
# Makes tty1 auto-login as the target user on every boot (including after
# a hard power cycle), so the VM comes up straight at a shell prompt with
# no password/keyboard interaction required.
#
# install.sh substitutes @USER@ with the target username. The %I is a systemd
# specifier that expands to the instance name (the tty, e.g. "tty1") -- it MUST
# stay literal here. Do NOT replace it with the username: agetty's last
# positional arg is the TTY, so "--noclear zach" makes agetty try /dev/zach,
# fail, and respawn-loop (black screen).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin @USER@ --noclear %I $TERM
