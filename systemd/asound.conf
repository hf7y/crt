# Installed to /etc/asound.conf by install.sh.
#
# Shared microphone capture. The raw ALSA hardware capture device (hw:0,0) can
# only be opened by ONE process at a time, but the crt console wants both the
# STT loop AND a live level meter reading the mic. `dsnoop` fans one hardware
# capture stream out to multiple readers.
#
# It also keeps the hardware stream open continuously (the meter keeps reading),
# which sidesteps a VirtualBox quirk where the emulated capture goes silent
# after the guest repeatedly opens/closes the device between utterances.
pcm.crtmic_dsnoop {
    type dsnoop
    ipc_key 3141592
    slave {
        pcm "hw:0,0"
        channels 2
        rate 44100
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}

# Consumer-facing device: `plug` on top adds automatic rate/channel/format
# conversion, so callers can ask for 16 kHz mono (what whisper wants) freely.
pcm.crtmic {
    type plug
    slave.pcm "crtmic_dsnoop"
}
