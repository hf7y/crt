# gitleaks.yml -- crt#148: the check that makes staying public safe.
# Named for the tool, not "secret*" -- that glob is in .gitignore (crt#128)
# and would silently swallow a file with "secret" in its own name.
# Fails the PR on a finding rather than reporting -- a reporting-only guard
# here would be ignored the same way realisateur#882 already warned against.
name: secret-scan

on:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
