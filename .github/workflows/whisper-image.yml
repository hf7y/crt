# As zaxon-image.yml: dexter must recover with `compose pull` and no checkout.
name: whisper-image

on:
  push:
    branches: [main]
    paths:
      - 'provision/dexter/whisper/**'
      - '.github/workflows/whisper-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: provision/dexter/whisper
          push: true
          tags: |
            ghcr.io/hf7y/whisper:latest
            ghcr.io/hf7y/whisper:${{ github.sha }}
