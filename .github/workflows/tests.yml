# tests.yml -- runs the offline suite tests/run_tests.sh describes as
# needing "No VM/hardware/network ... these are exactly the checks that CAN
# run before ever touching crt-vm." Nothing wired it to CI before this
# (crt#144); do not add it to required_status_checks until it has reported
# green on a real PR here -- a required check with zero history blocks
# every PR, including this one.
name: tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_tests.sh
