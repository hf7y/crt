# tests.yml -- runs tests/run_tests.sh (crt#144). Not required yet: it has
# no history, and a required check with zero history blocks every PR.
name: tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_tests.sh
