# zaxon on dexter, at /srv/zaxon/. Deploy and the one-owner rule: see README.
services:
  gateway:
    # PULLED, NOT BUILT: a dexter that lost its checkout recovers from this file.
    image: ghcr.io/hf7y/zaxon:latest
    container_name: zaxon-gateway
    restart: always
    volumes:
      # ORIGINAL absolute paths, both: the venv's shebangs and its python symlink
      # (to the uv-managed 3.11) are absolute and dangle at any other mount point.
      - ./data:/home/zaxon/.hermes
      - ./uv:/home/zaxon/.local/share/uv
    # BOUND, NOT AUTHENTICATED: this distro also carries 192.168.0.22, so
    # "8643:8643" gave the house LAN ask_zach (#402). Naming addresses IS the guard.
    ports:
      - "127.0.0.1:8643:8643"
      - "100.107.253.56:8643:8643"
      # whisper's: a `network_mode: service:` container may not publish its own.
      # Loopback only, no tailnet twin -- nothing off-host may post audio.
      - "127.0.0.1:8090:8090"
    environment:
      # NOT in data/.env, which .deploykeep shields from every deploy -- which is
      # why the repo's whisper_stt.sh never ran. But .env is loaded with
      # override=True and BEATS this, so the old line stays commented out there.
      HERMES_LOCAL_STT_COMMAND: /opt/zaxon-relay/bin/whisper_stt.sh {input_path} {output_dir} {language}

  # THE MCP DOOR, separate as it was in the distro: it owns ask_zach.
  relay:
    image: ghcr.io/hf7y/zaxon:latest
    container_name: zaxon-relay
    restart: always
    volumes:
      - ./data:/home/zaxon/.hermes
      - ./uv:/home/zaxon/.local/share/uv
    working_dir: /opt/zaxon-relay
    # `hermes send` reaches the Baileys bridge on localhost:3000, a gateway child.
    network_mode: "service:gateway"
    # The IMAGE's python: hermes-agent's venv leads PATH and has no `mcp`.
    command: ["/usr/local/bin/python", "/opt/zaxon-relay/zaxon_relay_server.py"]
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8643),5); s.close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Tails agent.log for Zach's replies, matching them to tickets. Reads only.
  watcher:
    image: ghcr.io/hf7y/zaxon:latest
    container_name: zaxon-watcher
    restart: always
    volumes:
      - ./data:/home/zaxon/.hermes
      - ./uv:/home/zaxon/.local/share/uv
    working_dir: /opt/zaxon-relay
    network_mode: "service:gateway"
    command: ["/usr/local/bin/python", "/opt/zaxon-relay/zaxon_relay_watcher.py"]
    depends_on:
      - relay

  # STT, dead 2026-08-02 to 2026-08-25: it was a unit in the `hermes` distro,
  # which stopped unsupervised, and no sensor named 8090. Built from ../whisper/.
  whisper:
    image: ghcr.io/hf7y/whisper:latest
    container_name: zaxon-whisper
    restart: always
    # whisper_stt.sh curls 127.0.0.1:8090 from INSIDE the gateway, so sharing
    # that namespace is what keeps the existing URL correct.
    network_mode: "service:gateway"
    depends_on:
      - gateway
    # 141 MiB of model, off the image and out of data/.
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fs", "-m", "5", "http://127.0.0.1:8090/health"]
      interval: 60s
      timeout: 10s
      # A cold volume downloads the model before the port opens.
      start_period: 300s
      retries: 3

volumes:
  whisper-models:
