# zaxon on dexter -- deployed to /srv/zaxon/ by bin/dexter-service-deploy.sh.
#
# THE ONE-OWNER RULE, stated where it can be acted on. `data/` holds a WhatsApp
# LINKED-DEVICE session (Baileys). Exactly one process may own it. If the
# `hermes` WSL distro is running its own bridge against the same session at the
# same time, WhatsApp logs the link out and recovering costs a QR scan on
# Zach's phone. The deploy script refuses to start these while that distro is
# up; it is not a comment, it is a check.
#
# Two services, not one process with two threads: when the bridge dies, only
# the bridge restarts, and the gateway's own supervision does not mask it.
services:
  gateway:
    build: .
    image: zaxon-gateway:local
    container_name: zaxon-gateway
    restart: always
    # The whole app directory, at the SAME path it has inside the distro --
    # the venv's shebangs are absolute and would break at any other mount point.
    volumes:
      - ./data:/home/zaxon/.hermes
    # 8643 is the MCP door every agent in the estate calls. Bound on all
    # interfaces because monkey reaches it over the VirtualBox NAT gateway and
    # mandark over the tailnet -- see realisateur/ZAXON.md's route table.
    ports:
      - "8643:8643"
    depends_on:
      - bridge
    healthcheck:
      # A relay that answers TCP but not MCP is the failure this project keeps
      # meeting. Probe the endpoint, not the port.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8643/mcp', timeout=5).status < 500 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  bridge:
    build: .
    image: zaxon-gateway:local
    container_name: zaxon-bridge
    restart: always
    volumes:
      - ./data:/home/zaxon/.hermes
    working_dir: /home/zaxon/.hermes/hermes-agent/scripts/whatsapp-bridge
    command: ["node", "bridge.js"]
    # Deliberately NOT published. The bridge listens on :3000 and speaks for
    # Zach's WhatsApp account; only the gateway needs to reach it, and it does
    # so over compose's own network.
    expose:
      - "3000"
